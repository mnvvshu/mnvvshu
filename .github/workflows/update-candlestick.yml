name: Update Contributions Candlestick Chart

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'

  # Allow manual trigger from Actions tab
  workflow_dispatch:

  # Also run on pushes to main (e.g. when you first set this up)
  push:
    branches: [main]
    paths:
      - 'generate_chart.py'

jobs:
  update-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate candlestick chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          OUTPUT_PATH: assets/contributions-candlestick.svg
        run: python generate_chart.py

      - name: Commit and push updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-candlestick.svg
          # Only commit if there are changes
          git diff --staged --quiet || (
            git commit -m "📈 Update contributions candlestick chart [skip ci]"
            git push
          )
